    - generic [ref=e163]:
      - heading "Сезонные заказы" [level=2] [ref=e164]
      - paragraph [ref=e165]: "Сезонная категория — та, у которой за три лучших месяца подряд продаётся больше половины годового объёма. Сейчас это: триммеры — март–июль; лески и ножи — апрель–июль; обогреватели — сентябрь–декабрь. Остальные категории продаются ровнее и заказываются обычным циклом."
      - paragraph [ref=e166]: "Под сезон заказ размещается один раз, заранее: крайний срок = начало сезона минус срок поставки поставщика. У разных поставщиков срок поставки разный, поэтому одна категория может стоять в нескольких группах — одна группа = один заказ одному поставщику. Если срок этого сезона уже прошёл, показан срок на следующий год. Раскройте группу, чтобы увидеть товары."
      - paragraph [ref=e167]: Всего в списке 165 SKU. Нужен сезонный заказ в ближайшие 90 дней, до 11.11.2026, — у 70 SKU. Эти товары отмечены в списке; товары без сезонной партии в показатель не входят.
