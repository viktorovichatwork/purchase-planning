[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "purchase-planning"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["openpyxl>=3.1,<4"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "ruff>=0.8", "mypy>=1.13", "types-openpyxl", "playwright>=1.50,<2"]

[tool.setuptools.packages.find]
include = ["purchase_planning*"]

[tool.setuptools.package-data]
purchase_planning = ["methodology.md"]

[tool.ruff]
line-length = 120
lint.select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.12"
packages = ["purchase_planning"]
