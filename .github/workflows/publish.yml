name: План закупок и Pages

on:
  push:
    branches: [main]
    paths: ["inbox/*.csv", "inbox/export_meta.json"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: purchase-planning-pages
  queue: max

jobs:
  calculate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    outputs:
      artifact: ${{ steps.artifact-name.outputs.name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install .
      - name: Рассчитать и собрать сайт
        env:
          EXPLABS_API_KEY: ${{ secrets.EXPLABS_API_KEY }}
          EXPLABS_MODEL: ${{ vars.EXPLABS_MODEL }}
          LLM_MAX_SKUS: ${{ vars.LLM_MAX_SKUS }}
        run: |
          set -euo pipefail
          PURCHASE_CODE_REVISION="$(git rev-parse HEAD)"
          export PURCHASE_CODE_REVISION
          if [[ -d runs ]]; then
            last_run="$(find runs -mindepth 2 -maxdepth 2 -name run.json | sort -V | tail -n 1)"
            if [[ -n "$last_run" ]]; then
              last_source="$(python -c 'import json, sys; print(json.load(open(sys.argv[1])).get("source_revision") or "")' "$last_run")"
              if [[ -n "$last_source" && "$last_source" != "$GITHUB_SHA" ]] \
                && git merge-base --is-ancestor "$GITHUB_SHA" "$last_source" \
                && [[ "$(git rev-parse "$GITHUB_SHA:inbox")" != "$(git rev-parse "$last_source:inbox")" ]]; then
                echo "::error::Уже обработана выгрузка из более нового коммита."
                exit 1
              fi
            fi
          fi
          mkdir -p "$RUNNER_TEMP/export/inbox"
          if git cat-file -e "$GITHUB_SHA:inbox"; then
            git archive "$GITHUB_SHA" inbox | tar -x -C "$RUNNER_TEMP/export"
          fi
          options=()
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            options+=(--reject-duplicate)
          fi
          status=0
          python -m purchase_planning.runs "$RUNNER_TEMP/export/inbox" \
            --history-dir runs --site-dir "$RUNNER_TEMP/site" --refresh-backtest "${options[@]}" || status=$?
          # 3: the export was rejected; the previous plan is republished with the reason (ADR 0007).
          if [[ "$status" -eq 3 ]]; then
            echo "::warning::Выгрузка отклонена. На портале остаётся прежний план, причина показана на портале."
          elif [[ "$status" -ne 0 ]]; then
            exit "$status"
          fi
          # The export behind the published plan, for visitors who want to try an upload (ADR 0007).
          last_run="$(find runs -mindepth 2 -maxdepth 2 -name run.json | sort -V | tail -n 1)"
          plan_source="$(python -c 'import json, sys; print(json.load(open(sys.argv[1])).get("source_revision") or "")' "$last_run")"
          git archive --format=zip -o "$RUNNER_TEMP/site/erp-export.zip" "${plan_source:-$GITHUB_SHA}" inbox
      - name: Сохранить историю
        run: |
          git add -- runs/
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' \
                -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
                commit -m "Сохранить расчёт закупок ($GITHUB_RUN_ID)"
            # A user can upload the next export while the current one is calculating.
            if ! git push origin HEAD:main; then
              git -c user.name='github-actions[bot]' \
                  -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
                  pull --rebase origin main
              git push origin HEAD:main
            fi
          fi
      - name: Имя артефакта попытки
        id: artifact-name
        run: echo "name=github-pages-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/site
          name: ${{ steps.artifact-name.outputs.name }}

  deploy:
    needs: calculate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
        with:
          artifact_name: ${{ needs.calculate.outputs.artifact }}
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.calculate.outputs.artifact }}
      - name: Проверить опубликованную дату среза
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          tar -xf artifact.tar ./index.html
          grep -F '<time datetime="' index.html
          for attempt in {1..12}; do
            if curl --fail --silent --show-error --location --compressed --max-time 15 \
              "${PAGE_URL%/}/?run=${GITHUB_RUN_ID}&attempt=${attempt}" -o published.html \
              && cmp -s index.html published.html; then
              exit 0
            fi
            sleep 5
          done
          echo "::error::Pages не вернул дашборд с ожидаемой датой среза."
          exit 1
